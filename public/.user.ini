; Hostinger (LiteSpeed/PHP) per-directory overrides — raise limits for video uploads.
; Note: changes can take up to ~5 min to apply; some shared plans cap these — set higher
; values in hPanel → PHP Configuration if the plan allows.
upload_max_filesize = 512M
post_max_size = 528M
max_execution_time = 600
max_input_time = 600
memory_limit = 512M
